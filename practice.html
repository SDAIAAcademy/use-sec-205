<section>
<h2>اليوم 1: خطة على الطريق وتنبؤ بالموسم</h2>
<ol>
<li><p>أداة حل تقترح خطة أقصر بكثير من خطة المرسِل، وتقول إن كل الطلبات في نوافذها. ما أول ما تفعله قبل أن تعتمدها؟</p><ul><li><b>أ.</b> تعتمدها، فالأداة تحسب أدق من الإنسان</li><li><b>ب.</b> تقارن الكيلومترات بخطة المرسِل وتختار الأقصر</li><li><b>ج.</b> تعيد قيادة الخطتين بقواعد المرسِل ثم تقارن</li><li><b>د.</b> تجربها يومًا كاملًا في مستودع واحد ثم تقرر</li></ul></li>
<li><p>بعد إضافة ثلاث قواعد، بقي طلب واحد متأخرًا بسبب راحة السائق، وهذه النسخة من الأداة لا تعرف الراحة. ما الأنسب؟</p><ul><li><b>أ.</b> تبقي الراحة على المرسِل وتطلب أداة تدعمها</li><li><b>ب.</b> تلغي الراحة في الأيام المزدحمة لتطابق الخطة</li><li><b>ج.</b> ترفض الأداة وتعود إلى الخطة اليدوية كاملة</li><li><b>د.</b> تطيل نوافذ التسليم حتى يختفي التأخر من التقرير</li></ul></li>
<li><p>تشتري تنبؤًا لتخطط عدد السائقين في موسم العيد. المورِّد يعرض خطأ 3.2% على ستة أسابيع من الخريف. ما الذي تطلبه قبل أن تقرر؟</p><ul><li><b>أ.</b> الخطأ نفسه بمقياس آخر غير الخطأ النسبي</li><li><b>ب.</b> الخطأ على سنة كاملة بدل ستة أسابيع</li><li><b>ج.</b> شهادة بأن الرقم حُسب حسابًا صحيحًا</li><li><b>د.</b> الخطأ على موسم عيد سابق مع خطَّي الأساس</li></ul></li>
<li><p>التنبؤ يغلب «الأسبوع الماضي» في الأيام العادية، ويخسر أمام «العام الماضي» في العطلات. أي قاعدة تكتبها لتخطيط السائقين؟</p><ul><li><b>أ.</b> نستخدم التنبؤ دائمًا، فمتوسط خطئه أقل</li><li><b>ب.</b> التنبؤ في الأيام العادية، و«العام الماضي» في العطلات</li><li><b>ج.</b> نترك التنبؤ ونخطط كل الأيام بـ «العام الماضي» وحده</li><li><b>د.</b> نأخذ متوسط التنبؤ والخطين كل يوم</li></ul></li>
<li><p>أداة حل تقترح خطة لثماني شاحنات أقصر بـ 30% من خطة المرسِل. ملف الطلبات فيه عمود يعلّم البضاعة المبرّدة، والنموذج لم يُطلب منه أن يقرأه. ما الذي تتوقعه حين تعيد قيادة الخطة بقواعد المرسِل؟</p><ul><li><b>أ.</b> أن تبقى الخطة أقصر وبلا مخالفات، فالعمود في الملف</li><li><b>ب.</b> أن تظهر طلبات مبرّدة في شاحنات غير مبرّدة</li><li><b>ج.</b> أن تطول الخطة لأن الأداة تحسب بلا ازدحام</li><li><b>د.</b> أن يقل التأخر لأن الأداة تحترم النوافذ</li></ul></li>
<li><p>خطة يدوية تقطع 565 كم بقواعد المرسِل الأربع، وخطة أداة الحل الأولى 357 كم بقواعد الأداة، وبعد إعطاء الأداة ثلاث قواعد صارت 450 كم. ما الرقم الذي تنقله إلى مديرة التخطيط بوصفه الوفر المتوقع؟</p><ul><li><b>أ.</b> نحو 37%: من 565 إلى 357 كما في التقرير الأول</li><li><b>ب.</b> لا وفر، فالأداة أخطأت في تشغيلها الأول</li><li><b>ج.</b> نحو 20%: من 565 إلى 450 بالقواعد نفسها</li><li><b>د.</b> نحو 21%: من 450 إلى 357 بعد القواعد</li></ul></li>
<li><p>مدير أسطول يسأل: «لماذا نحتاج إلى أداة حل ولدينا نموذج يتنبأ بالطلب؟». أي جواب يفرّق بين الأداتين؟</p><ul><li><b>أ.</b> التنبؤ يقدّر رقمًا، وأداة الحل تختار خطة تحت قيود</li><li><b>ب.</b> أداة الحل أدق لأنها تتعلم من بيانات أكثر من التنبؤ</li><li><b>ج.</b> الاثنتان تتنبآن بالطلب، لكن أداة الحل أسرع في الحساب</li><li><b>د.</b> التنبؤ للمدير في مكتبه، وأداة الحل للسائق على الطريق</li></ul></li>
<li><p>بعد إضافة القواعد التي يقبلها النموذج، بقي طلب متأخر بسبب راحة السائق، وهذه الأداة لا تعرف الراحة. ما الشرط الأنسب قبل التشغيل في مستودع واحد؟</p><ul><li><b>أ.</b> إلغاء الراحة في الأيام المزدحمة وحدها، مع تعويض السائق</li><li><b>ب.</b> إطالة نوافذ التسليم حتى يختفي التأخر من التقرير</li><li><b>ج.</b> رفض الأداة والعودة إلى الخطة اليدوية في كل المستودعات</li><li><b>د.</b> مرسِل يراجع كل خطة قبل خروج الشاحنات</li></ul></li>
<li><p>تنبؤ خطؤه النسبي 3.2% في ستة أسابيع من الخريف، و35.5% في ستة أسابيع من العطلات. خط «العام الماضي» خطؤه 8.4% ثم 14.6%. أي حكم يدعمه الدليل؟</p><ul><li><b>أ.</b> التنبؤ أفضل دائمًا لأن متوسط خطئه في الفترتين أقل</li><li><b>ب.</b> خط «العام الماضي» أفضل دائمًا لأنه أثبت في العطلات</li><li><b>ج.</b> التنبؤ في الأيام العادية، و«العام الماضي» في العطلات</li><li><b>د.</b> لا يمكن الحكم دون سنة كاملة من الأخطاء بالمقياسين</li></ul></li>
<li><p>في يوم فعلي فيه 5,220 رحلة، توقّع نموذج 24,074 رحلة. ما الخطأ النسبي بالمئة، مقربًا إلى أقرب عدد صحيح؟ <span class="unit">(%)</span></p></li>
<li><p>خط «العام الماضي» يأخذ اليوم نفسه من الأسبوع قبل 364 يومًا. لماذا قد يخطئ في عيد يتبع التقويم الهجري؟</p><ul><li><b>أ.</b> لأن العيد يتقدم نحو 11 يومًا كل عام ميلادي</li><li><b>ب.</b> لأن 364 يومًا أقل من السنة الميلادية بيوم واحد</li><li><b>ج.</b> لأن الطلب في الأعياد ينمو كل عام مع نمو المدينة</li><li><b>د.</b> لأن الخط لا يعرف أيام الأسبوع ولا مواسم الطلب</li></ul></li>
<li><p>مورِّد يعرض تنبؤًا لتخطيط السائقين في رمضان. ما الدليل الذي يجيب عن سؤالك؟</p><ul><li><b>أ.</b> خطؤه على سنة كاملة بمقياسين، MAE وMAPE معًا</li><li><b>ب.</b> شهادة من جهة مستقلة بأن حساب الخطأ في نشرته صحيح</li><li><b>ج.</b> عدد العملاء الذين يستخدمونه في المنطقة ومدة استخدامهم</li><li><b>د.</b> خطؤه في رمضان والعيد لعامين، مقابل خط العيد نفسه</li></ul></li>
<li><p>تكتب سطر «تخطيط المسارات» في خريطتك. أي دور تولٍّ يناسب هذه الحالة؟</p><ul><li><b>أ.</b> المورِّد، لأنه يملك الخوارزمية ويعرف حدودها</li><li><b>ب.</b> السائق، لأنه ينفذ الخطة ويرى الطريق</li><li><b>ج.</b> مدير تقنية المعلومات، لأنه يشغّل الأداة</li><li><b>د.</b> المرسِل الذي يراجع الخطة ويستطيع ردها</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: السلامة بأرقام صادقة، والأتمتة بكلمات دقيقة</h2>
<ol>
<li><p>أداة حل قالت «صفر تأخر»، وتنبؤ قال «خطأ 3.2%». ما الذي كشف حدود الرقمين في المختبرين؟</p><ul><li><b>أ.</b> إعادة الحساب بأداة أخرى أدق</li><li><b>ب.</b> الحكم على الرقمين بقواعدنا وفي فترتنا نحن</li><li><b>ج.</b> الاعتماد على خبرة المرسِل والمخطط وحدها</li><li><b>د.</b> طلب شرح مكتوب من المورِّد لطريقة حساب الرقم</li></ul></li>
<li><p>مجموعة أ: 12 حادثًا في 400,000 كم. مجموعة ب: 9 حوادث في 100,000 كم. مدير يقترح أن تبدأ بمجموعة أ لأن حوادثها أكثر. ماذا تقول؟</p><ul><li><b>أ.</b> أوافق: 12 حادثًا أكثر من 9</li><li><b>ب.</b> متساويتان تقريبًا: الفرق 3 حوادث فقط</li><li><b>ج.</b> لا أحكم حتى أعرف أعمار السائقين</li><li><b>د.</b> ب أولًا: 90 لكل مليون كم مقابل 30</li></ul></li>
<li><p>«يَقِظ» تقترح حفظ كل مقاطع السائقين سنة كاملة «لأغراض التدريب». أي شرط تكتبه في ورقة المشروع التجريبي؟</p><ul><li><b>أ.</b> مقطع عند الحدث فقط، يُحفظ أيامًا ما لم يُحقَّق فيه</li><li><b>ب.</b> نقبل السنة كاملة إن وقّع كل سائق موافقة مكتوبة</li><li><b>ج.</b> نقبل السنة بشرط تشفير المقاطع في الخادم والمركبة</li><li><b>د.</b> لا شرط، فالكاميرا في مركبات الشركة</li></ul></li>
<li><p>نشرة شاحنات: «يبقي الشاحنة في منتصف المسار ويضبط سرعتها. ارفع يديك عن المقود، وأبقِ عينيك على الطريق». على أي مستوى؟</p><ul><li><b>أ.</b> المستوى 3، فاليدان خارج المقود</li><li><b>ب.</b> المستوى 1، فهو يساعد السائق فقط</li><li><b>ج.</b> المستوى 2، والسائق يقود ويشرف</li><li><b>د.</b> المستوى 4، فهو يعمل على الطريق السريع وحده</li></ul></li>
<li><p>روبوت توصيل بطيء وخفيف على الأرصفة: الاحتمالية «غير مرجّح» (2)، والأثر «مرتفع» (3) لأن أسوأ المتوقع إصابة مارٍّ لا تهدد حياته. ما مستواه، وماذا تكتب في الخريطة؟</p><ul><li><b>أ.</b> مرتفع لأنه يتحرك بين المشاة، وتحذفه من الخريطة</li><li><b>ب.</b> منخفض، فالمجموع 5 صغير</li><li><b>ج.</b> متوسط (6)، ولا يحتاج إلى دور تولٍّ</li><li><b>د.</b> متوسط (6)، مع دور تولٍّ في الخريطة</li></ul></li>
<li><p>مستودع الشمال سجّل 114 حادثًا في سنة، ومستودع الوسط 85. قطعت مركبات الشمال 3.0 ملايين كيلومتر، والوسط 0.75 مليون. أي المستودعين أعلى خطرًا لكل كيلومتر؟</p><ul><li><b>أ.</b> الشمال: 114 حادثًا مقابل 85</li><li><b>ب.</b> الوسط: نحو 113 لكل مليون كم مقابل 38</li><li><b>ج.</b> متساويان تقريبًا: الفرق 29 حادثًا فقط في سنة</li><li><b>د.</b> لا يمكن الحكم دون عدد السائقين في كل مستودع</li></ul></li>
<li><p>دراجات نارية سجلت 101 حادث في 0.65 مليون كيلومتر. ما المعدل لكل مليون كيلومتر، مقربًا إلى أقرب عدد صحيح؟ <span class="unit">(حادث لكل مليون كم)</span></p></li>
<li><p>ركّبت شركة كاميرات في المركبات العشرين صاحبة أكثر الحوادث في الربع الأول، فانخفضت حوادثها 68% في الربع الثاني. المركبات العشرون التالية لها، بلا كاميرات، انخفضت 55%. ما التفسير الأقرب؟</p><ul><li><b>أ.</b> الكاميرا خفضت الحوادث 68%، وهذا ما يقيسه الربع الثاني</li><li><b>ب.</b> الكاميرا لا أثر لها إطلاقًا، فالمجموعتان انخفضتا معًا</li><li><b>ج.</b> الأرقام صغيرة فلا يُستنتج منها شيء عن الكاميرا</li><li><b>د.</b> أغلبه ارتداد نحو المتوسط، والكاميرا قد تفسر الفرق الباقي</li></ul></li>
<li><p>مورِّد كاميرات يقترح حفظ مقاطع السائقين سنة كاملة «لأغراض التدريب». ما الذي تطلبه قبل الموافقة، وفق نظام حماية البيانات الشخصية؟</p><ul><li><b>أ.</b> موافقة كل سائق على حفظ مقاطعه سنة، ثم لا قيد بعدها</li><li><b>ب.</b> غرض محدد، وأقل البيانات، ومدة حفظ تنتهي بالغرض، ومن يرى</li><li><b>ج.</b> تشفير المقاطع في الخادم فقط، فالتشفير وحده يكفي للنظام</li><li><b>د.</b> لا شيء، فالمقاطع مسجلة داخل مركبات تملكها الشركة</li></ul></li>
<li><p>نشرة تقول: «ارفع يديك عن المقود على الطريق السريع، وأبقِ عينيك على الطريق». على أي مستوى هذه الخاصية؟</p><ul><li><b>أ.</b> المستوى 3، لأن اليدين خارج المقود</li><li><b>ب.</b> المستوى 4، لأنها تعمل على الطريق السريع وحده</li><li><b>ج.</b> المستوى 2، لأن الإشراف ما زال على الإنسان</li><li><b>د.</b> المستوى 1، لأنها تحتاج إلى عيني السائق</li></ul></li>
<li><p>مركبة توصيل بلا أحد على متنها تعمل في حيين، نهارًا، بسرعة محدودة، وتتوقف جانبًا حين تتعذر عليها الحركة، وفريق عن بعد يقترح مسارًا دون أن يقودها. على أي مستوى؟</p><ul><li><b>أ.</b> المستوى 4: نطاق محدود ولا تطلب أن يتولى إنسان</li><li><b>ب.</b> المستوى 3: الفريق عن بعد هو من يتولى عند الحاجة</li><li><b>ج.</b> المستوى 5: لا أحد على متنها في أي رحلة</li><li><b>د.</b> المستوى 2: الفريق عن بعد يشرف عليها طوال الوقت</li></ul></li>
<li><p>نظام يحذّر من الخروج من المسار ومن النقطة العمياء، ويكبح وحده كبحًا طارئًا. على أي مستوى بحسب جدول SAE؟</p><ul><li><b>أ.</b> المستوى 1، لأنه يكبح وحده</li><li><b>ب.</b> المستوى 2، لأنه يجمع أكثر من وظيفة</li><li><b>ج.</b> المستوى 3، لأنه يتصرف دون السائق في الطوارئ</li><li><b>د.</b> المستوى 0: تنبيهات ومساعدة لحظية</li></ul></li>
<li><p>إعلان يسمي خاصية «الطيار الآلي الكامل»، وفي شروطه: «يجب على السائق الإشراف الدائم والتدخل فورًا». ما الذي تكتبه في جدول الادعاءات؟</p><ul><li><b>أ.</b> المستوى 2، فالاسم لا يغيّر ما يُطلب من السائق</li><li><b>ب.</b> المستوى 5، كما يقول الاسم «الطيار الآلي الكامل»</li><li><b>ج.</b> المستوى 3، لأن التدخل مطلوب عند الحاجة فقط</li><li><b>د.</b> لا يمكن الحكم حتى يعلن المورِّد المستوى رسميًا</li></ul></li>
<li><p>حالة استخدام: درجة إرهاق للسائقين تقترح من يُمنع من وردية إضافية. الاحتمالية «مرجّح» (3) والأثر «مرتفع» (3). ما مستوى المخاطر في مصفوفة الإطار الوطني؟</p><ul><li><b>أ.</b> متوسط، لأن الناتج 6</li><li><b>ب.</b> مرتفع، لأن الناتج 9</li><li><b>ج.</b> كارثي، لأنها تمس السلامة</li><li><b>د.</b> منخفض، لأن الإنسان يراجع</li></ul></li>
<li><p>مشارك يرتب حالات خريطته بالقيمة × الجاهزية ويحذف كل حالة مخاطرها مرتفعة. ما الملاحظة الأنسب من لجنة السلامة؟</p><ul><li><b>أ.</b> صحيح، فالحالات ذات المخاطر المرتفعة لا تُجرَّب في التشغيل</li><li><b>ب.</b> الأفضل أن يرتب بالمخاطر وحدها ويبدأ بأقلها</li><li><b>ج.</b> لا تُحذف: تبقى بشروطها، كدور التولي وحدود البيانات</li><li><b>د.</b> الأفضل أن يرتب بالقيمة وحدها ويترك الجاهزية للفريق التقني</li></ul></li>
</ol>
